services:
  # The portal. This is the only service Task 0 needs actually running —
  # `docker compose up -d flask` is the smoke-test entrypoint.
  flask:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mariadb
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: seiyaku
      MARIADB_PASSWORD: seiyaku_pw
      MARIADB_DATABASE: seiyaku
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DATABASE: seiyaku
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BIND_DN: cn=admin,dc=hunterassoc,dc=org
      LDAP_BIND_PASSWORD: seiyaku_pw

  # --- Declared for later tasks; not required for the Task 0 smoke test. ---
  # No route in this scaffold calls core/db.py yet, so flask has no
  # depends_on here on purpose — later tasks that actually wire a challenge
  # to one of these add both the depends_on and the seed mount.

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: seiyaku_root_pw
      MARIADB_DATABASE: seiyaku
      MARIADB_USER: seiyaku
      MARIADB_PASSWORD: seiyaku_pw
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./seed/mariadb:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: seiyaku
    volumes:
      - mongo_data:/data/db
      - ./seed/mongo:/docker-entrypoint-initdb.d:ro

  # OpenLDAP image choice: osixia/openldap:1.5.0. bitnami/openldap (the
  # image originally declared here) no longer resolves on any tag in this
  # environment (Bitnami has deprecated/moved its free-tier Docker Hub
  # images) — osixia/openldap:1.5.0 is confirmed pullable and is a
  # widely-used, well-documented image, so it replaces bitnami here.
  # Env vars are osixia's convention (LDAP_ORGANISATION/LDAP_DOMAIN/
  # LDAP_ADMIN_PASSWORD), not bitnami's (LDAP_ROOT/LDAP_ADMIN_USERNAME).
  # LDAP_DOMAIN=hunterassoc.org makes osixia derive the base DN
  # dc=hunterassoc,dc=org itself on first boot. Custom sub-tree seeding
  # (zodiac.ldif) is loaded via osixia's LDAP_SEED_INTERNAL_LDIF_PATH:
  # that env var names a mounted directory of *.ldif files which the
  # image's startup script copies into its internal custom-bootstrap-ldif
  # directory and applies once, on first boot of an empty data volume,
  # right after it bootstraps the root suffix itself.
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Hunter Association
      LDAP_DOMAIN: hunterassoc.org
      LDAP_ADMIN_PASSWORD: seiyaku_pw
      LDAP_TLS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: /ldifs
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./seed/ldap:/ldifs:ro

  # Out-of-band (OOB) collaborator: logs any HTTP request and any DNS
  # query it receives, in-memory, and exposes GET /captures (JSON) for the
  # portal to poll. Only needs to be reachable from other services on the
  # internal compose network by its service name (`collaborator`) — not
  # published to the host. See docs/oob-spike.md for the emitter mechanism
  # that actually calls this service.
  collaborator:
    build: ./collaborator
    expose:
      - "80"
      - "53/udp"

volumes:
  mariadb_data:
  mongo_data:
  openldap_data:
  openldap_config:
